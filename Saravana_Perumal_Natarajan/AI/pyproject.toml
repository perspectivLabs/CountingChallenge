[project]
name = "counting-ai"
version = "0.1.0"
description = "Count objects and draw masks with a fine-tuned YOLO11n-seg model."
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.1",
    "ultralytics>=8.4.202",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
